version: '3.8'

services:
  portal-news:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-news:latest
    container_name: portal_news_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://seudominio.com.br
      - SITE_DOMAIN=https://seudominio.com.br
      - NEXT_PUBLIC_ADSENSE_ID=ca-pub-7059730627018047
      - NEWS_API_KEY=bn_88feb5baa3f84955677e8c11453aae352811b9fe6c3398cd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
