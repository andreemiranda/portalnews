version: '3.8'

services:
  portal-news:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-news:latest
    container_name: portal_news_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://portalnews-pi.vercel.app
      - SITE_DOMAIN=https://portalnews-pi.vercel.app
      - NEXT_PUBLIC_ADSENSE_ID=${NEXT_PUBLIC_ADSENSE_ID:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
